name: Release image

# Manual-only, deliberately: this workflow stays fully inert until a human
# enables it. No `push`/`tags` trigger is wired up here on purpose — flipping
# that on is a separate, deliberate follow-up once the required secrets/vars
# below are actually provisioned in this repo's GitHub settings.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the short commit SHA)'
        required: false
        default: ''

# Mirrors this repo's .gitlab-ci.yml `build:image` stage: a multi-stage Docker
# build (Maven package -> JRE runtime) pushed to a container registry. GitLab
# CI pushes to its own in-cluster registry using CI_JOB_TOKEN; this GitHub
# mirror instead publishes to GHCR.
#
# The Dockerfile's build stage still needs to resolve the PRIVATE
# net.hugmesh:hugmesh-commons / hugmesh-parent artifacts (not on Maven
# Central) via the committed settings.xml, which expects a GitLab
# CI_JOB_TOKEN-shaped credential against the org's GitLab Maven Package
# Registry (see settings.xml). That registry is a separate system from
# GitHub, so before this workflow can actually run a human needs to add:
#   - secrets.GITLAB_CI_JOB_TOKEN  (or equivalent long-lived deploy token)
#   - vars.CI_API_V4_URL           (the GitLab instance's API base)
#   - vars.GITLAB_GROUP_ID         (the HugMesh group id on that GitLab instance)
# until then, the `docker build` step below will fail to resolve hugmesh-commons.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          secrets: |
            ci_job_token=${{ secrets.GITLAB_CI_JOB_TOKEN }}
          build-args: |
            CI_API_V4_URL=${{ vars.CI_API_V4_URL }}
            GITLAB_GROUP_ID=${{ vars.GITLAB_GROUP_ID }}
          tags: |
            ghcr.io/hugmesh/hugmesh-mesh-bff-api:${{ steps.vars.outputs.tag }}
            ghcr.io/hugmesh/hugmesh-mesh-bff-api:latest
